coverage:
  status:
    project:
      default:
        target: auto
        threshold: 0.25%
        if_not_found: failure
        informational: false
        only_pulls: true
        flags:
          - product
      tooling:
        target: 71.8%
        threshold: 2%
        if_not_found: failure
        informational: true
        only_pulls: true
        flags:
          - tools
    patch:
      default:
        target: auto
        informational: true
        only_pulls: true
        flags:
          - product

flags:
  product:
    paths:
      - src/topmark/**
  tools:
    paths:
      - tools/**

component_management:
  individual_components:
    - component_id: topmark
      name: TopMark package
      paths:
        - src/topmark/**
    - component_id: tools
      name: Repository tooling
      paths:
        - tools/**

comment:
  layout: "header, diff, flags, components, files, footer"
  behavior: default
  require_changes: "any_change"
  require_base: true
  require_head: true
  hide_project_coverage: false
