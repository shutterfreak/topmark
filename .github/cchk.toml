[commit]
require_signed_off_by = true
conventional_commits = true
subject_imperative = true
allow_commit_types = [
  "build",
  "chore",
  "ci",
  "docs",
  "feat",
  "fix",
  "perf",
  "refactor",
  "revert",
  "style",
  "test",
]
subject_min_length = 10
subject_max_length = 72
