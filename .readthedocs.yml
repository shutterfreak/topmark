# Read the Docs configuration file
# See https://docs.readthedocs.io/en/stable/config-file/v2.html for details

# Required
version: 2

# Set the OS, Python version, and other tools you might need
build:
  os: ubuntu-24.04
  tools:
    python: "3.14"
  commands:
    # Install uv, then install the project with its production Zensical docs extra.
    - python -m pip install uv
    - uv pip install --system -e .[docs]
    # Materialize and build TopMark-owned inputs with only relative Zensical paths.
    - python -m tools.docs.prepare_zensical_docs
    - zensical build --config-file .zensical/zensical.toml --strict
    - cp -a .zensical/site/. "$READTHEDOCS_OUTPUT/html/"
