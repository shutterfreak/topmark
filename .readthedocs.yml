# Read the Docs configuration file
# See https://docs.readthedocs.io/en/stable/config-file/v2.html for details

# Required
version: 2

# Set the OS, Python version, and other tools you might need
build:
  os: ubuntu-26.04
  tools:
    python: "3.14"
  jobs:
    # setuptools-scm needs release-tag history for the version token in generated documentation.
    post_checkout:
      - git fetch --unshallow || true
    install:
      # Install uv, then install the project with its production Zensical docs extra:
      - python -m pip install uv
      # Invoke uv as a Python module: RTD jobs do not preserve the installed script's PATH entry.
      - python -m uv pip install --system -e .[docs]
    build:
      html:
        # Materialize TopMark-owned inputs with only relative Zensical paths:
        - python -m tools.docs.prepare_zensical_docs
        # Invoke Zensical as a module: RTD jobs do not preserve installed script PATH entries.
        - python -m zensical build --config-file .zensical/zensical.toml --strict
    post_build:
      # RTD explicitly requires custom builders to create the output-format directory themselves:
      - mkdir -p "$READTHEDOCS_OUTPUT/html/"
      # Copy the generated documentation to the output-format directory:
      - cp -a .zensical/site/. "$READTHEDOCS_OUTPUT/html/"
