# ============================================================================
# TopMark configuration
# ============================================================================

# Canonical example configuration for TopMark.
#
# This file documents the supported configuration surface, layered
# configuration semantics, runtime policies, and common customization points.
# It is intended both as a starter template and as a reference example.

# ----------------------------------------------------------------------------
# Config discovery & precedence
# ----------------------------------------------------------------------------
# TopMark resolves configuration using the following precedence order
# (lowest to highest):
#   1. Built-in defaults (defined by TopMark)
#   2. User configuration files (~/.config/topmark/topmark.toml or
#      ~/.topmark.toml)
#   3. Project configuration files discovered for each input:
#      * Each file input contributes its parent directory's ancestor chain.
#      * Each directory input contributes its ancestor chain and supported
#        descendant configuration sources.
#      * If no inputs are provided, discovery uses the current working
#        directory chain.
#      * In each directory, TopMark considers both:
#          - pyproject.toml  (table: [tool.topmark])
#          - topmark.toml    (tool-specific file)
#        Same-directory precedence: pyproject.toml is merged first,
#        then topmark.toml overrides it.
#      * Applicable directories are merged root → target (nearest wins).
#      * Set `[config].root = true` in a discovered config to stop further
#        upward traversal.
#   4. Extra configuration files passed explicitly via --config
#      (merged in the order provided)
#   5. CLI overrides (highest precedence)
#
# A nested source applies only to files below its containing directory, so it
# can override inherited settings without affecting siblings. Descendant source
# discovery is independent of processing-file selection because a nested source
# may define selection filters for its own subtree.
#
# Path resolution rules:
#   * Globs declared in configuration files are resolved relative to the
#     directory that contains the configuration file.
#   * Globs declared via CLI are resolved relative to the current working
#     directory (invocation site).
#   * Path-to-file settings (e.g., include_from/exclude_from/files_from) are
#     resolved relative to the declaring source (configuration file directory,
#     or CWD for CLI options). The referenced files' own patterns are evaluated
#     relative to each file's own directory.
#   * `relative_to` affects only header metadata (e.g., `file_relpath`), not
#     discovery.
#
# To mark a directory boundary for discovery, set:
#   [config]
#   root = true
# in `topmark.toml`, or within `[tool.topmark.config]` in `pyproject.toml`.
# The default is `root = false` (continue traversing parents).
#
# Special flags:
#   * --no-config disables user+project discovery (only defaults → --config
#     → CLI).


# ----------------------------------------------------------------------------
# Config source options
# ----------------------------------------------------------------------------

[config]
# Options that affect configuration discovery and configuration-loading
# behavior.
#
# These settings are TOML-source-local metadata.
#
# They do not participate in layered configuration merging. Instead, they are
# resolved separately while TopMark discovers and loads TOML sources.

# Stop further upward configuration discovery above the directory containing
# this TOML source.
#
# Discovery semantics:
#   - In `topmark.toml`, this lives under `[config]`.
#   - In `pyproject.toml`, this lives under `[tool.topmark.config]`.
#
# Uncomment to mark this TOML source as a discovery boundary:
# root = true

# Source-local strictness preference for staged configuration and
# runtime-applicability diagnostics.
#
# Runtime semantics:
#   - Applies to staged configuration-loading validation
#     (TOML-source, merged-config, and runtime-applicability diagnostics).
#   - Not limited to TOML parsing or layered configuration merge validation.
#
# Resolution:
#   - Resolved separately from layered configuration values.
#   - Highest-precedence non-null value wins across discovered TOML sources.
#   - CLI/API overrides take final precedence for the current run.
#
# strict = false


# ----------------------------------------------------------------------------
# Header field configuration
# ----------------------------------------------------------------------------

[header]
# Configuration for header fields and metadata to include in generated headers

# Ordered list of field names to render in the TopMark header.
#
# A field name may refer to:
#   1. A built-in field computed from the filesystem.
#   2. A custom field defined under the [fields] table below.
#
# Built-in field names:
#   - file         : base file name (no path)
#   - file_relpath : file path relative to `header.relative_to`
#                    (or CWD if `header.relative_to` is unset)
#   - file_abspath : absolute file path
#   - relpath      : parent directory of `file_relpath`
#   - abspath      : parent directory of `file_abspath`
#
# Additional notes:
#   - The `[fields]` table may contain additional key/value pairs that are not
#     listed here. Only the names in `header.fields` are rendered in the header.
#   - If a custom field name overlaps with a built-in field name, TopMark will
#     warn and the custom value will override the built-in value for rendering.
fields = ["file", "file_relpath"]

# Affects header metadata (e.g., file_relpath) only, not discovery.
# relative_to = "."


# ----------------------------------------------------------------------------
# Field definitions
# ----------------------------------------------------------------------------

[fields]
# Definitions of field names (keys) and values
#
# Note: keys defined here do not have to be rendered. Only keys listed in
# `header.fields` are included in generated headers.

# Project name included in generated headers.
# project = "TopMark"

# License identifier included in generated headers. Example values: 'MIT',
# 'GPL-3.0', 'Apache-2.0'
# license = "MIT"

# Copyright statement included in generated headers.
# copyright = "(c) 2025 Your Name" # Update according to your needs

# Under the target #339 design, multiline TOML strings use pipe-prefixed
# continuation records in generated headers. Leading and trailing blank lines
# are trimmed; selected wrapping fields reflow prose paragraphs.
# notice = """
# First line.
# Second line.
# """


# ----------------------------------------------------------------------------
# Formatting configuration
# ----------------------------------------------------------------------------

[formatting]
# Formatting options used while rendering headers.

# Align the fields (colons) in the header for better readability.
# Values: true or false.
align_fields = true

# Optional soft maximum for complete physical header field lines. The value
# counts Unicode code points after processor prefixes, suffixes, and
# indentation. Unbreakable content may exceed the target and is never
# hard-split.
# max_header_line_length = 100

# Fields eligible for automatic prose wrapping. Wrapping is active only when
# the width above is set and a field is listed here.
wrap_fields = []


# ----------------------------------------------------------------------------
# Writer configuration
# ----------------------------------------------------------------------------
#
# Writer options are non-layered runtime preferences persisted in TOML.
#
# They do not participate in layered configuration merging and are resolved
# separately from the layered configuration model.

[writer]

# Strategy used when writing to files (ignored when writing to STDOUT):
#   "atomic"  -> write to a temporary file and replace the original
#                  file (safe, default)
#               CLI equivalent: --write-mode atomic

#   "inplace" -> overwrite the original file in place
#                  (faster, less safe)
#               CLI equivalent: --write-mode inplace
strategy = "atomic"

# ----------------------------------------------------------------------------
# Policy configuration
# ----------------------------------------------------------------------------

[policy]
# Runtime policy configuration governing header insertion and update behavior.
#
# header_mutation_mode:
#   Controls whether TopMark processes all files, only files missing a header,
#   or only files that already contain a header.
#
#   Supported values:
#     "all"         -> allow both insert and update
#                      (default)
#     "add_only"    -> only insert missing headers
#                      (do not update existing headers)
#     "update_only" -> only update existing headers
#                      (do not insert missing headers)
header_mutation_mode = "all"

# bom_before_shebang:
#   Controls a UTF-8 BOM immediately before a shebang for shebang-aware files.
#
#   Supported values:
#     "reject"     -> refuse processing and leave the file unchanged (default)
#     "remove_bom" -> plan removal of the BOM so `#!` begins at byte zero
#
#   CLI equivalent values for check and strip are `reject` and `remove-bom`.
bom_before_shebang = "reject"

# mixed_line_endings:
#   "reject" refuses files containing more than one recognized physical
#   terminator (default). "preserve" permits header processing while retaining
#   every existing non-header terminator exactly; it never normalizes the body.
mixed_line_endings = "reject"

# allow_header_in_empty_files:
#   Permit inserting a header into an otherwise empty file (e.g.,
# `__init__.py`).
# Disabled by default to avoid surprising diffs in placeholder files.
allow_header_in_empty_files = false

# empty_insert_mode:
#   Controls which files count as "empty" when
#   `allow_header_in_empty_files = true`.
#
#   Supported values:
#     "bytes_empty"      -> only true 0-byte files
#     "logical_empty"    -> 0-byte files plus placeholder inputs such as
#                           BOM-only, newline-only, or optional horizontal
#                           whitespace with at most one trailing newline
#     "whitespace_empty" -> any decoded text containing no non-whitespace
#                           characters
#
#   Recommended value:
#     "logical_empty"
empty_insert_mode = "logical_empty"

# render_empty_header_when_no_fields:
#   Allow TopMark to insert an otherwise empty header block when no header
#   fields are configured. This is disabled by default.
render_empty_header_when_no_fields = false

# allow_reflow:
#   Permit reflowing file content while inserting a header block. This may break
#   strict insert → strip → insert idempotence and is therefore disabled by
#   default.
allow_reflow = false

# allow_content_probe:
#   Allow runtime content-based file-type detection when names/extensions
#   are insufficient. Disable this to force name/extension-only resolution.
allow_content_probe = true

# Per-file-type policy overrides.
# These inherit from `[policy]` and override only the keys specified here.
# Define sub-tables under `[policy_by_type.<file_type_id>]` to fine-tune
# behavior.
#
# Example (uncomment to allow headers in empty Python files only):
#
# [policy_by_type.python]
# header_mutation_mode = "add_only"
# allow_header_in_empty_files = true
# empty_insert_mode = "logical_empty"


# ----------------------------------------------------------------------------
# Files configuration
# ----------------------------------------------------------------------------

[files]

# File discovery, activation, filtering, and runtime selection behavior.
#
# Processing pipeline:
#   1. Input paths and path-based include/exclude filters select candidates.
#   2. The last applicable matching file-type rule selects a registered type
#      directly, or restores ordinary automatic recognition. Without a winning
#      assignment, name/content matching and scoring select the type.
#   3. File-type filters, activation consent, processor bindings, and runtime
#      policies still govern whether the selected file can be processed.
#
# Include/exclude glob patterns.
# Patterns in configuration files are evaluated relative to the configuration
# file's directory.
# include_patterns = ["src/**", "tests/**"]
# exclude_patterns = [".venv/**", "**/__pycache__/**"]

# Load include/exclude patterns from files (one pattern per line; supports
# comments).
# These paths are resolved relative to the configuration file's directory.
# include_from = ["include.txt"]
# exclude_from = ["exclude.txt"]

# Provide the explicit file list from files (one path per line; supports
# comments).
# These paths are resolved relative to the configuration file's directory.
# files_from = ["files.txt"]

# Optional allowlist of file type identifiers to process (after include/exclude
# patterns):
# include_file_types = ["python", "markdown"]

# Optional denylist of file type identifiers to exclude (after include/exclude
# patterns):
# exclude_file_types = ["html"]

# Explicit processing consent for file types declared "opt-in".
#
# This is separate from include_file_types and exclude_file_types: include
# filters do not activate a type, and exclude filters remain a veto. A type
# declared "never" is recognized but can never be made processable.
#
# Local identifiers are accepted when unambiguous; canonical qualified
# identifiers are preferred in shared configuration.
# opt_in_file_types = ["topmark:json-as-jsonc"]

# Optional list of input paths (files/directories) to scan.
# These are typically specified via CLI.
# files = ["src", "tests", "README.md"]


# ----------------------------------------------------------------------------
# File-type assignments and inference controls
# ----------------------------------------------------------------------------
#
# Assign existing registered file types to selected paths. This does not define
# new file types or change processor bindings. Assignments bypass automatic
# name/content recognition, but retain type-specific policies, activation
# consent, type filters, insertion checks, and runtime safety checks.
# A filtered, unauthorized, never-processable, or unbound assigned type does
# not fall back to another type. Rules do not add input paths or bypass path
# exclusions.
#
# Rules accumulate in source/layer order; the last applicable matching rule
# wins. Ancestor rules precede local rules; same-directory pyproject.toml rules
# precede topmark.toml rules. Explicit --config sources follow discovered
# sources, and CLI rules follow configuration rules. Local configurations affect
# only their subtree and honor discovered root = true boundaries.
#
# Patterns use the declaring configuration directory as their definition base;
# CLI patterns use the invocation directory. Matching follows resolved target
# paths, so symlink aliases use the target's scope. Patterns are case-sensitive
# gitignore-style positive globs with POSIX '/' separators on every platform:
#   - A basename such as '.project_ignore' matches at any depth, including
#     dotfiles.
#   - 'config/*.json' and '/config/*.json' are anchored to the definition base.
#   - '*' stays within one directory; '**' can match across directories.
#   - Backslashes escape literal glob characters and significant trailing
#     spaces.
# Leading spaces are literal; unescaped trailing spaces are ignored.
# Empty, whitespace-only, negated ('!'), comment ('#'), and malformed patterns
# are invalid. Escape an initial literal '!' or '#' with a backslash.
#
# Type filters apply to the assigned identity: excluding topmark:json does not
# block a topmark:jsonc assignment; excluding topmark:jsonc does, without fallback.
# Include filters do not grant activation consent for opt-in types.
#
# An empty file_type_assignments list adds no rules and retains inherited
# assignments. A separate clear-all setting is deferred from the initial
# release.
# file_type_assignments = []

# Each assignment requires one file_type and a nonempty list of patterns.
# Omitted action means "assign"; explicit action = "assign" is also valid.
# Unknown actions, missing targets, conflicting fields, and invalid shapes are
# configuration errors. Unknown keys follow the normal warning/strict policy.
# Local identifiers are accepted only when unambiguous and are normalized to
# canonical qualified identities. Use the identities shown here in shared files.
#
# Uncomment the desired entries below. In pyproject.toml, use
# [[tool.topmark.files.file_type_assignments]] for each entry instead.
#
# Reuse the existing git-meta type and its pound-comment processor:
# [[files.file_type_assignments]]
# file_type = "topmark:git-meta"
# patterns = [".project_ignore"]
#
# Treat known JSONC documents as JSONC even before they contain comments:
# [[files.file_type_assignments]]
# file_type = "topmark:jsonc"
# patterns = ["config/service.json", "config/local/*.json"]
#
# Restore automatic recognition for matching paths. This entry must omit the
# file_type key entirely. A winning inference rule cancels earlier assignments
# without resuming the search through them; there is no reserved 'auto' type.
# [[files.file_type_assignments]]
# action = "infer"
# patterns = ["generated/**"]
#
# A later assignment can override the inference control for one selected path:
# [[files.file_type_assignments]]
# action = "assign"
# file_type = "topmark:jsonc"
# patterns = ["generated/special.json"]
#
# For JSON documents known to permit comments, assign topmark:jsonc, rather
# than topmark:json-as-jsonc. The latter retains its content-based automatic
# recognition and separate insertion guard, and still requires opt-in consent.
# Ordinary unassigned JSON keeps its existing never-processable behavior.
#
# CLI equivalents for check, strip, probe, config check, and config dump:
#   --assign-filetype 'topmark:jsonc=*.json'
#   --infer-filetype 'generated/**'
#   --assign-filetype 'topmark:jsonc=generated/special.json'
# Both options are repeatable and share one sequence in actual argument order.
# One assignment occurrence supplies one type and one pattern, split at the
# first '=' only. Further '=', colons, commas, spaces, Unicode, and glob syntax
# remain part of the pattern. Values are not trimmed or comma-split; quote them
# against shell expansion. The --option=VALUE spelling is also supported.
#
# Ordinary overlaps are valid overrides. Contradictory duplicate patterns in
# the same source warn; strict mode treats warnings as validation failures.
# 'topmark probe' explains the winner and its source/base/scope/order; use -v
# to show superseded rules in TEXT; Markdown always shows them and ignores -v.
# 'topmark config check' validates rules without requiring matching files to
# exist. Configuration dumps retain absolute rule bases/scopes rather than
# relocating them to a new checkout.


# ============================================================================
# End of TopMark configuration
# ============================================================================
